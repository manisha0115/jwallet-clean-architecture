name: jwallet_clean_architecture
description: A clean-architecture Flutter wallet demo with system light/dark themes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  dartz: ^0.10.1
  http: ^1.6.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
